services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabegheno
      POSTGRES_PASSWORD: sabegheno
      POSTGRES_DB: sabegheno
    # Expose Postgres only when explicitly needed from the host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabegheno -d sabegheno"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sabegheno_pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Containers reach Postgres by the compose service name, not localhost.
      DATABASE_URL: postgresql://sabegheno:sabegheno@db:5432/sabegheno?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

volumes:
  sabegheno_pgdata:
