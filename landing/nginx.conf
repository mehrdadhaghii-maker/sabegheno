server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # static page: no inline script, no inline style attributes
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # the ONLY two backend paths the marketing site may reach: the public partner list and the uploaded logos
  location = /api/public/partners { proxy_pass http://api:3000/api/public/partners; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 10s; }
  location /api/uploads/logos/ { proxy_pass http://api:3000/api/uploads/logos/; expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; }
  location /api/ { return 404; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; default_type application/xml; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=86400"; }

  location /assets/ { expires 30d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; }
  location /fonts/  { expires 365d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options "nosniff" always; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; }
}
