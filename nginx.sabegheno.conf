# ---------------------------------------------------------------------------
# Hosts (v16)
#   landing page ........ sabegheno.ir / www.sabegheno.ir  → 127.0.0.1:3002
#   business panel + API  app.sabegheno.ir                                                      → 127.0.0.1:3000
#   admin panel .......... admin.sabegheno.ir                                                   → 127.0.0.1:3001
# DNS: A records for sabegheno.ir, www, app and admin → this server.
# TLS: issue ONE certificate that lists every name, e.g.
#   certbot certonly --nginx -d sabegheno.ir -d www.sabegheno.ir -d app.sabegheno.ir -d admin.sabegheno.ir
# and point ssl_certificate to that lineage (adjust the paths below).
# ---------------------------------------------------------------------------

# Landing page
server {
    listen 80;
    server_name sabegheno.ir www.sabegheno.ir;
    return 301 https://www.sabegheno.ir$request_uri;
}
server {
    listen 443 ssl http2;
    server_name sabegheno.ir;
    ssl_certificate /etc/letsencrypt/live/sabegheno.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabegheno.ir/privkey.pem;
    return 301 https://www.sabegheno.ir$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.sabegheno.ir;
    ssl_certificate /etc/letsencrypt/live/sabegheno.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabegheno.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Business / user panel (+ /api proxied by the container's nginx)
server {
    listen 80;
    server_name app.sabegheno.ir;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name app.sabegheno.ir;
    ssl_certificate /etc/letsencrypt/live/sabegheno.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabegheno.ir/privkey.pem;
    client_max_body_size 20M;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin panel: separate hostname because it is a separate SPA.
server {
    listen 80;
    server_name admin.sabegheno.ir;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name admin.sabegheno.ir;
    client_max_body_size 12M;
    ssl_certificate /etc/letsencrypt/live/sabegheno.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabegheno.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
